<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
<title id="title">Panel Gracza — app/calculator_algorithms.py</title>
<desc id="desc">Source excerpt, lines 57–78. def purchase_steps(remaining, count=30, sets=DEFAULT_SETS):
    milestones = optimal_purchase_plan(remaining, count, sets)
    resources = list(remaining)
    cumulative = [0, 0, 0, 0]
    steps = []
    for milestone in milestones:
        order = milestone[&apos;order&apos;]
        resources = list(remaining)
        cumulative = [0, 0, 0, 0]
        last_missing = [0, 0, 0, 0]
        for set_number in order:
            group = sets[set_number - 1]
            last_missing = [max(0, group[i] - resources[i]) for i in range(4)]
            resources = [resources[i] + last_missing[i] - group[i] for i in range(4)]
            cumulative = [cumulative[i] + last_missing[i] for i in range(4)]
        steps.append({
            &apos;set&apos;: order[-1],
            &apos;missing&apos;: last_missing,
            &apos;total_cost&apos;: milestone[&apos;cost&apos;],
            &apos;total_bought&apos;: cumulative,
        })
    return steps</desc>
