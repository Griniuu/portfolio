<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="310" viewBox="0 0 1320 310" role="img" aria-labelledby="title desc">
<title id="title">Panel Gracza — static/js/drify-rules.js</title>
<desc id="desc">Source excerpt, lines 63–68. function getEffectiveItemCapacity(slot, itemInfo = {}) {
    if (hasUnlimitedEpicCapacity(slot &amp;&amp; slot.item)) return Infinity;
    const base = Number(slot &amp;&amp; slot.pojemnosc) || Number(itemInfo.pojemnosc) || 0;
    const quality = Number(slot &amp;&amp; slot.quality) || 0;
    return base + (GOLD_QUALITY_CAPACITY[quality] || 0);
}</desc>
