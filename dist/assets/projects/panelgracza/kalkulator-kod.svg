<title id="title">Panel Gracza — app/calculator_algorithms.py</title>
<desc id="desc">Source excerpt, lines 14–32. def maximize_souls(resources, sets=DEFAULT_SETS):
    sets = tuple(tuple(group) for group in sets)

    @lru_cache(maxsize=None)
    def solve(remaining):
        best = (0, (0,) * len(sets), ())
        for index, group in enumerate(sets):
            if all(remaining[i] &gt;= group[i] for i in range(4)):
                next_resources = tuple(remaining[i] - group[i] for i in range(4))
                count, combo, order = solve(next_resources)
                candidate_combo = list(combo)
                candidate_combo[index] += 1
                candidate = (count + 1, tuple(candidate_combo), order + (index + 1,))
                if candidate[0] &gt; best[0]:
                    best = candidate
        return best

    count, combo, order = solve(tuple(resources))
    return count, list(combo), list(order)</desc>
