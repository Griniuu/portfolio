<title id="title">Panel Gracza — static/js/drify-rules.js</title>
<desc id="desc">Source excerpt, lines 38–49. function getEpicSlotRules(itemName) {
    const info = itemName ? ITEMS_DB[itemName] : null;
    if (!info || !info.epik) return null;
    const v2 = isEpicV2Item(itemName);
    return {
        version: v2 ? &apos;V2&apos; : &apos;V1&apos;,
        lockedDrifts: !v2,
        editableDrifts: v2,
        driftSlots: v2 ? 3 : (EPIC_DRIFTS[itemName] || []).length,
        orbSlots: v2 ? 2 : 1,
    };
}</desc>
