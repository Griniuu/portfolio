<svg xmlns="http://www.w3.org/2000/svg" width="1348" height="340" viewBox="0 0 1348 340" role="img" aria-labelledby="title desc">
<title id="title">Loot Strefa TCG — public/js/cart.js</title>
<desc id="desc">Source excerpt, lines 419–425. function isValidPolishNip(value){
  const nip = normalizeNip(value);
  if(nip.length !== 10) return false;
  const weights = [6, 5, 7, 2, 3, 4, 5, 6, 7];
  const checksum = weights.reduce((sum, weight, index)=&gt;sum + Number(nip[index]) * weight, 0) % 11;
  return checksum !== 10 &amp;&amp; checksum === Number(nip[9]);
}</desc>
