<svg xmlns="http://www.w3.org/2000/svg" width="1602" height="1120" viewBox="0 0 1602 1120" role="img" aria-labelledby="title desc">
<title id="title">Loot Strefa TCG — public/js/cart.js</title>
<desc id="desc">Source excerpt, lines 273–305. function scoreCrossSellProduct(product, context){
  const text = crossSellProductText(product);
  const price = Number(product.price || 0);
  const productGame = crossSellGameForText(text);
  let score = 0;
  let reason = &apos;Dobry dodatek do zamowienia&apos;;

  if(context.games.includes(productGame)){
    score += 35;
    reason = `${productGame} pasuje do koszyka`;
  }
  if(isAccessoryProduct(text)){
    score += 20;
    reason = context.hasExpensiveCard ? &apos;Ochrona do drozszych kart&apos; : &apos;Przydatna ochrona kart&apos;;
  }
  if(context.hasExpensiveCard &amp;&amp; isProtectionProduct(text)){
    score += 35;
    reason = &apos;Zabezpiecz drozsze karty&apos;;
  }
  if(context.games.includes(productGame) &amp;&amp; isSealedProduct(text)){
    score += 22;
    reason = `Dodatkowy produkt ${productGame}`;
  }
  if(context.freeShippingGap &gt; 0 &amp;&amp; context.freeShippingGap &lt;= 60 &amp;&amp; price &gt; 0 &amp;&amp; price &lt;= context.freeShippingGap + 5){
    score += 30;
    reason = `Brakuje ok. ${fmtMoney(context.freeShippingGap)} do darmowej dostawy`;
  }
  if(Number(product.featured || 0) === 1) score += 8;
  if(Number(product.isNewActive || product.isNew || 0) === 1) score += 6;
  if(Number(product.compareAtPrice || 0) &gt; price) score += 5;
  if(price &gt; 0 &amp;&amp; price &lt;= 25) score += 4;
  return { product, score, reason };
}</desc>
