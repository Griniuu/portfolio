<desc id="desc">Source excerpt, lines 126–132. def description_text(raw):
    value = str(raw or &quot;&quot;)
    if re.search(r&quot;&lt;/?[a-z][^&gt;]*&gt;&quot;, value, re.I):
        parser = ProductHTMLParser(text_only=True)
        parser.feed(value)
        value = parser.result()
    return &quot; &quot;.join(value.split())</desc>
