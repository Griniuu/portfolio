<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="550" viewBox="0 0 1320 550" role="img" aria-labelledby="title desc">
<title id="title">Loot Strefa TCG — public/js/cart.js</title>
<desc id="desc">Source excerpt, lines 316–329. function selectCrossSellProducts(products, cart){
  const cartIds = new Set(cart.map(item =&gt; Number(item.id)));
  const context = buildCrossSellContext(cart);
  return (Array.isArray(products) ? products : [])
    .filter(product =&gt; Number(product.id) &gt; 0 &amp;&amp; !cartIds.has(Number(product.id)))
    .filter(product =&gt; Number(product.price || 0) &gt; 0 &amp;&amp; availableCrossSellStock(product) &gt; 0)
    .map(product =&gt; scoreCrossSellProduct(product, context))
    .filter(entry =&gt; entry.score &gt; 0)
    .sort((a, b) =&gt; {
      if(b.score !== a.score) return b.score - a.score;
      return Number(a.product.price || 0) - Number(b.product.price || 0);
    })
    .slice(0, 4);
}</desc>
