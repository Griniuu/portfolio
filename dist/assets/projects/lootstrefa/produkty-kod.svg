<title id="title">Loot Strefa TCG — server/product_content.py</title>
<desc id="desc">Source excerpt, lines 143–156. def default_specification(product, settings=None, keep_empty=False):
    settings = settings or {}
    key = &apos;cards&apos; if is_card_product(product) else product.get(&apos;category&apos;)
    groups = SPECIFICATION_TEMPLATES.get(key, SPECIFICATION_TEMPLATES[&apos;default&apos;])
    result = []
    for title, fields in groups:
        parameters = []
        for name, key in fields:
            value = str(product.get(key) or settings.get(key) or &apos;&apos;) if key else &apos;&apos;
            if keep_empty or value.strip():
                parameters.append({&apos;name&apos;: name, &apos;value&apos;: value})
        if keep_empty or parameters:
            result.append({&apos;title&apos;: title, &apos;parameters&apos;: parameters})
    return result</desc>
