<svg xmlns="http://www.w3.org/2000/svg" width="1723" height="460" viewBox="0 0 1723 460" role="img" aria-labelledby="title desc">
<title id="title">Loot Strefa TCG — public/js/cart.js</title>
<desc id="desc">Source excerpt, lines 4–14. function getCart(){
  try{
    const parsed = JSON.parse(localStorage.getItem(&apos;cart&apos;) || &apos;[]&apos;);
    if(!Array.isArray(parsed)) return [];
    return parsed
      .filter(item =&gt; item &amp;&amp; Number(item.id) &gt; 0)
      .map(item =&gt; ({...item, qty: Math.max(1, Math.floor(Number(item.qty) || 1)), price: Math.max(0, Number(item.price) || 0)}));
  }catch(_){
    return [];
  }
}</desc>
